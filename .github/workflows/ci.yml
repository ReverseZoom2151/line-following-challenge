name: CI

# Run on pushes and pull requests targeting main, and allow manual runs
# from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing here writes to the repository, so drop the token to read-only.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile the firmware sketch against the Pololu A-Star board core.
  # This does not flash or run anything, it only checks the sketch builds.
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned so a new upstream release cannot change what CI builds with,
      # and so the cache key below refers to something real.
      ARDUINO_CLI_VERSION: 1.5.1
      # Size ceilings for the regression guard below. The target is an
      # ATmega32U4: 28672 bytes of flash, 2560 bytes of RAM. Current usage
      # is about 8670 bytes flash and 243 bytes RAM, so these ceilings leave
      # deliberately generous headroom above that. They are not a tight
      # budget, they exist only to catch a sudden regression (for example a
      # library pulled in by accident, or a debug feature left enabled).
      FLASH_CEILING_BYTES: 20000
      RAM_CEILING_BYTES: 1200
    steps:
      - uses: actions/checkout@v5

      # arduino-cli downloads and caches board packages under ~/.arduino15.
      # Cache that directory so repeat runs do not re-download the cores and
      # board indexes every time. The key includes the pinned tool version so
      # that bumping it fetches a fresh set rather than reusing stale cores:
      # keying on this file alone would mean a cache poisoned on its first run
      # could never be evicted.
      - name: Cache arduino-cli data
        uses: actions/cache@v5
        with:
          path: ~/.arduino15
          key: ${{ runner.os }}-arduino15-${{ env.ARDUINO_CLI_VERSION }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-arduino15-${{ env.ARDUINO_CLI_VERSION }}-

      # Installed into a directory outside the checkout so the tool does not
      # appear as an untracked bin/ in the working tree.
      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/v${ARDUINO_CLI_VERSION}/install.sh \
            | BINDIR="$HOME/.local/bin" sh -s ${ARDUINO_CLI_VERSION}
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Pololu board index
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://files.pololu.com/arduino/package_pololu_index.json
          arduino-cli core update-index

      # The Pololu A-Star board definitions reference the arduino:avr platform
      # rather than bundling their own, so arduino:avr must be present or the
      # build fails with "missing platform release arduino:avr" at compile
      # time. arduino-cli does not resolve that dependency on its own, so both
      # cores are installed explicitly.
      - name: Install board cores
        run: |
          arduino-cli core install arduino:avr
          arduino-cli core install pololu-a-star:avr

      - name: Compile sketch
        run: |
          arduino-cli compile --fqbn pololu-a-star:avr:a-star32U4 line_following_robot

      # arduino-cli --json exposes the linked section sizes directly, so
      # this is parsed with jq (preinstalled on ubuntu-latest) rather than
      # scraping the human-readable "Sketch uses N bytes..." log line.
      # Confirmed against a real arduino-cli 1.5.1 compile that the JSON
      # shape is builder_result.executable_sections_size, a list of
      # {name, size, max_size} objects: "text" is flash, "data" is RAM.
      - name: Check flash and RAM usage
        run: |
          arduino-cli compile --fqbn pololu-a-star:avr:a-star32U4 line_following_robot --json > compile_result.json

          FLASH_BYTES=$(jq '.builder_result.executable_sections_size[] | select(.name == "text") | .size' compile_result.json)
          RAM_BYTES=$(jq '.builder_result.executable_sections_size[] | select(.name == "data") | .size' compile_result.json)

          if [ -z "$FLASH_BYTES" ] || [ -z "$RAM_BYTES" ]; then
            echo "Could not read flash/RAM sizes from arduino-cli JSON output, failing closed."
            cat compile_result.json
            exit 1
          fi

          FLASH_PCT=$(( FLASH_BYTES * 100 / 28672 ))
          RAM_PCT=$(( RAM_BYTES * 100 / 2560 ))

          echo "Flash usage: ${FLASH_BYTES} bytes of 28672 (${FLASH_PCT}% of device, ceiling ${FLASH_CEILING_BYTES})"
          echo "RAM usage:   ${RAM_BYTES} bytes of 2560 (${RAM_PCT}% of device, ceiling ${RAM_CEILING_BYTES})"

          FAILED=0
          if [ "$FLASH_BYTES" -gt "$FLASH_CEILING_BYTES" ]; then
            echo "Flash usage ${FLASH_BYTES} bytes exceeds the regression ceiling of ${FLASH_CEILING_BYTES} bytes."
            FAILED=1
          fi
          if [ "$RAM_BYTES" -gt "$RAM_CEILING_BYTES" ]; then
            echo "RAM usage ${RAM_BYTES} bytes exceeds the regression ceiling of ${RAM_CEILING_BYTES} bytes."
            FAILED=1
          fi
          exit $FAILED

  # Run static analysis over the firmware and host test sources. This does
  # not compile anything, it only looks for likely bugs and style issues
  # that cppcheck can spot without the Arduino toolchain.
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      # Arduino headers (Arduino.h and friends) are not available outside
      # the Arduino toolchain, so cppcheck cannot resolve them and would
      # otherwise flood the log with missingInclude noise on every file
      # that includes them. unusedFunction is also suppressed because this
      # is a library-style, header-heavy codebase where public methods are
      # legitimately never called from within the analysed set alone.
      # This suppression list is deliberately permissive to start: it is
      # meant to catch real issues without failing on false positives, and
      # should be tightened over time as the codebase and cppcheck's
      # understanding of it improve.
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --inline-suppr \
            --error-exitcode=1 \
            --std=c++17 \
            -I line_following_robot -I test \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            line_following_robot test

  # Build and run the C++ host tests. These exercise the sensor, motor, PID
  # and navigator logic on the runner's own g++ toolchain rather than on
  # target hardware, so they run on every push without needing a robot.
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run host test suite
        run: bash test/run_tests.sh
